<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 네컷">
<meta name="theme-color" content="#16131a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>오늘의 네컷 · 교회 포토부스</title>
<style>
  :root {
    --bg: #16131a;
    --panel: #221e28;
    --panel2: #2d2834;
    --line: #3b3544;
    --text: #f4f1f7;
    --muted: #a59fb0;
    --accent: #ff5c8a;
    --accent2: #ffb36b;
    --save: #22c77a;
    --print: #3d9bff;
    --font: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; color: inherit; }
  input, select { font-family: inherit; }

  .screen {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .screen.active { display: flex; }

  .btn {
    padding: 16px 28px; border-radius: 16px; font-size: 20px; font-weight: 700;
    background: var(--panel2); transition: transform .08s, opacity .2s;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .4; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
                 box-shadow: 0 10px 30px rgba(255, 92, 138, .35); }
  .btn.save { background: var(--save); color: #062b18; }
  .btn.print { background: var(--print); color: #fff; }
  .btn.ghost { background: transparent; border: 2px solid var(--line); }

  /* 홈 */
  #home h1 { font-size: clamp(36px, 7vw, 68px); font-weight: 900; letter-spacing: -1px; text-align: center; }
  #home h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2));
                  -webkit-background-clip: text; background-clip: text; color: transparent; }
  #home .sub { margin-top: 10px; color: var(--muted); font-size: 18px; text-align: center; }
  #home .start { margin-top: 44px; font-size: 30px; padding: 26px 70px; border-radius: 999px; }
  #home .summary { margin-top: 22px; color: var(--muted); font-size: 16px; text-align: center; }
  #home .corner { position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
                  display: flex; gap: 10px; align-items: center; }
  .badge { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--panel); color: var(--muted); }
  .badge.ok { color: #7ee2ad; }
  .icon-btn { width: 52px; height: 52px; border-radius: 14px; background: var(--panel2); font-size: 24px; }
  #home .warn { margin-top: 20px; max-width: 560px; padding: 14px 18px; border-radius: 12px;
                background: #3a2323; color: #ffb4b4; font-size: 15px; line-height: 1.5; display: none; }

  /* 촬영 */
  #shoot { gap: 18px; }
  .stage { position: relative; border-radius: 22px; overflow: hidden; background: #000;
           box-shadow: 0 16px 50px rgba(0,0,0,.55); }
  .stage video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stage video.mirror { transform: scaleX(-1); }
  .count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           font-size: clamp(120px, 26vmin, 260px); font-weight: 900; color: #fff;
           text-shadow: 0 6px 30px rgba(0,0,0,.6); pointer-events: none; }
  .count.pop { animation: pop .9s ease-out; }
  @keyframes pop { 0% { transform: scale(1.5); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 100% { opacity: .85; } }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 50; }
  .flash.on { animation: flash .45s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
  .shot-label { position: absolute; top: 14px; left: 14px; padding: 8px 14px; border-radius: 999px;
                background: rgba(0,0,0,.55); font-weight: 700; font-size: 18px; }
  .status { font-size: 22px; font-weight: 700; min-height: 30px; text-align: center; }
  .thumbs { display: flex; gap: 10px; }
  .thumbs .t { width: 84px; border-radius: 10px; background: var(--panel2); overflow: hidden;
               display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700;
               border: 2px solid transparent; }
  .thumbs .t.cur { border-color: var(--accent); }
  .thumbs .t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shoot-bottom { display: flex; gap: 14px; align-items: center; }

  /* 확인 */
  #review h2, #result h2 { font-size: 28px; margin-bottom: 6px; }
  #review .hint { color: var(--muted); margin-bottom: 18px; }
  .review-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: min(1000px, 100%); }
  .review-grid .cell { position: relative; border-radius: 14px; overflow: hidden; background: #000; }
  .review-grid .cell img { width: 100%; display: block; }
  .review-grid .cell button { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
                              padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 700;
                              background: rgba(0,0,0,.65); white-space: nowrap; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }

  /* 결과 */
  #result { gap: 16px; }
  #result-img { max-height: calc(100vh - 230px); max-width: 92vw; border-radius: 6px;
                box-shadow: 0 16px 50px rgba(0,0,0,.6); background: #fff; }
  #result .note { color: var(--muted); font-size: 14px; text-align: center; max-width: 640px; line-height: 1.5; }
  #result .row { margin-top: 0; }

  /* 설정 */
  #settings { justify-content: flex-start; background: var(--bg); z-index: 20; overflow-y: auto; padding-top: 0; }
  .set-head { position: sticky; top: 0; width: 100%; max-width: 1100px; display: flex; align-items: center;
              justify-content: space-between; padding: max(16px, env(safe-area-inset-top)) 0 12px; background: var(--bg); z-index: 2; }
  .set-head h2 { font-size: 26px; }
  .set-body { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 1fr 340px; gap: 24px; padding-bottom: 40px; }
  .set-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card { background: var(--panel); border-radius: 18px; padding: 18px 20px; }
  .card h3 { font-size: 17px; margin-bottom: 12px; }
  .card p.help { color: var(--muted); font-size: 14px; line-height: 1.5; margin-top: 10px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 70px; padding: 14px 10px; border-radius: 12px; background: var(--panel2);
                font-size: 17px; font-weight: 700; border: 2px solid transparent; }
  .seg button.on { border-color: var(--accent); background: #3a2533; }
  .seg button small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatches button { width: 58px; height: 58px; border-radius: 14px; border: 3px solid transparent; font-size: 11px; font-weight: 700; }
  .swatches button.on { border-color: var(--accent); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 14px; color: var(--muted); }
  .field input[type=text], select { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
                                     background: var(--panel2); color: var(--text); font-size: 17px; -webkit-user-select: text; user-select: text; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; font-size: 16px;
            border-top: 1px solid var(--line); }
  .toggle:first-of-type { border-top: none; }
  .toggle input { width: 26px; height: 26px; accent-color: var(--accent); }
  .frame-box { display: flex; gap: 14px; align-items: center; }
  .frame-thumb { width: 70px; height: 105px; border-radius: 8px; background: var(--panel2) center/cover no-repeat;
                 flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; }
  .frame-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .frame-actions .btn { font-size: 15px; padding: 11px 16px; border-radius: 12px; }
  .preview-wrap { position: sticky; top: 90px; }
  #preview-canvas { width: 100%; border-radius: 8px; background: #fff; display: block; box-shadow: 0 10px 30px rgba(0,0,0,.4); }

  .toast { position: fixed; left: 50%; bottom: max(30px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(30px);
           background: #000c; color: #fff; padding: 14px 22px; border-radius: 14px; font-size: 16px; opacity: 0;
           transition: all .25s; z-index: 100; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #print-area { display: none; }

  @media (max-width: 820px) {
    .set-body { grid-template-columns: 1fr; }
    .preview-wrap { position: static; max-width: 320px; margin: 0 auto; }
    .review-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* 인쇄: 4x6 인치 용지에 결과물만 꽉 차게 */
  @page { size: 4in 6in; margin: 0; }
  @media print {
    html, body { background: #fff !important; overflow: visible !important; height: auto !important; }
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; width: 4in; height: 6in; overflow: hidden; }
    #print-area img { width: 4in; height: 6in; object-fit: contain; display: block; }
  }
</style>
</head>
<body>

<!-- 홈 -->
<section id="home" class="screen active">
  <div class="corner">
    <span id="offline-badge" class="badge">오프라인 준비 중…</span>
    <button class="icon-btn" id="open-settings" aria-label="설정">⚙️</button>
  </div>
  <h1>오늘의 <span>네컷</span></h1>
  <p class="sub">화면을 보고 네 번 포즈를 취해 주세요!</p>
  <button class="btn primary start" id="start-btn">📸 촬영 시작</button>
  <p class="summary" id="summary"></p>
  <div class="warn" id="warn"></div>
</section>

<!-- 촬영 -->
<section id="shoot" class="screen">
  <div class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="count" id="count"></div>
    <div class="shot-label" id="shot-label"></div>
  </div>
  <div class="status" id="status"></div>
  <div class="shoot-bottom">
    <div class="thumbs" id="thumbs"></div>
    <button class="btn ghost" id="cancel-btn">그만하기</button>
  </div>
</section>

<!-- 사진 확인 / 한 장씩 다시 찍기 -->
<section id="review" class="screen">
  <h2>사진 확인</h2>
  <p class="hint">마음에 안 드는 사진은 눌러서 그 사진만 다시 찍을 수 있어요</p>
  <div class="review-grid" id="review-grid"></div>
  <div class="row">
    <button class="btn ghost" id="review-home">처음으로</button>
    <button class="btn" id="review-all">전부 다시 찍기</button>
    <button class="btn primary" id="review-done">✨ 완성하기</button>
  </div>
</section>

<!-- 결과 -->
<section id="result" class="screen">
  <img id="result-img" alt="완성된 네컷 사진">
  <div class="row">
    <button class="btn save" id="save-btn">📥 사진 앱에 저장</button>
    <button class="btn print" id="print-btn">🖨️ 인쇄하기</button>
    <button class="btn ghost" id="result-home">처음으로</button>
  </div>
  <p class="note" id="result-note"></p>
</section>

<!-- 설정 -->
<section id="settings" class="screen">
  <div class="set-head">
    <h2>⚙️ 설정</h2>
    <button class="btn primary" id="close-settings">완료</button>
  </div>
  <div class="set-body">
    <div class="set-col">
      <div class="card">
        <h3>⏱️ 촬영 타이머 (한 컷마다)</h3>
        <div class="seg" id="timer-seg"></div>
      </div>

      <div class="card">
        <h3>🧩 레이아웃 (4×6 인치 용지)</h3>
        <div class="seg" id="layout-seg"></div>
      </div>

      <div class="card">
        <h3>🎨 기본 프레임 색상</h3>
        <div class="swatches" id="theme-swatches"></div>
      </div>

      <div class="card">
        <h3>🖼️ 내 프레임 이미지 (JPG / PNG)</h3>
        <div class="frame-box">
          <div class="frame-thumb" id="frame-thumb">없음</div>
          <div>
            <div class="frame-actions">
              <button class="btn" id="frame-pick">이미지 선택</button>
              <button class="btn ghost" id="frame-remove">삭제</button>
              <button class="btn ghost" id="frame-template">템플릿 받기</button>
            </div>
            <input type="file" id="frame-file" accept="image/png,image/jpeg" hidden>
          </div>
        </div>
        <div class="seg" id="frame-mode-seg" style="margin-top:14px"></div>
        <p class="help" id="frame-help"></p>
      </div>

      <div class="card">
        <h3>✏️ 하단 문구</h3>
        <div class="field"><label for="title-in">큰 문구</label><input type="text" id="title-in" maxlength="30"></div>
        <div class="field"><label for="subtitle-in">작은 문구 (선택 · 예: 말씀 구절)</label><input type="text" id="subtitle-in" maxlength="50"></div>
        <div class="field"><label for="textcolor-sel">문구 색</label>
          <select id="textcolor-sel">
            <option value="theme">프레임 색상에 맞춤</option>
            <option value="black">검정</option>
            <option value="white">흰색</option>
          </select>
        </div>
        <label class="toggle">문구 표시<input type="checkbox" id="showtext-chk"></label>
        <label class="toggle">날짜 표시<input type="checkbox" id="showdate-chk"></label>
      </div>

      <div class="card">
        <h3>🔧 기타</h3>
        <label class="toggle">사진 모서리 둥글게<input type="checkbox" id="round-chk"></label>
        <label class="toggle">가운데 자르는 선 (스트립)<input type="checkbox" id="cut-chk"></label>
        <label class="toggle">카운트다운 효과음<input type="checkbox" id="sound-chk"></label>
        <label class="toggle">셀카 좌우반전 (거울처럼)<input type="checkbox" id="mirror-chk"></label>
        <div class="field" style="margin-top:10px"><label for="facing-sel">카메라</label>
          <select id="facing-sel">
            <option value="user">전면 카메라 (셀카)</option>
            <option value="environment">후면 카메라</option>
          </select>
        </div>
      </div>
    </div>

    <div class="set-col">
      <div class="preview-wrap">
        <div class="card">
          <h3>👀 출력 미리보기</h3>
          <canvas id="preview-canvas" width="1200" height="1800"></canvas>
          <p class="help">실제 인쇄되는 4×6 한 장의 모습입니다.</p>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>
<div id="print-area"><img id="print-img" alt=""></div>

<script>
'use strict';

/* ───────── 기본 정의 ───────── */
const SHEET_W = 1200, SHEET_H = 1800;   // 4x6인치 @300DPI
const TIMERS = [3, 5, 8, 10];
const FONT = '"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';

// 좌표는 한 '단위' 캔버스 기준. 스트립은 600x1800 단위를 두 번 찍어 1200x1800 한 장을 만든다.
const LAYOUTS = {
  strip: {
    label: '스트립 2줄', desc: '반으로 잘라 2명', W: 600, H: 1800, dup: true, textTop: 1498,
    slots: [0, 1, 2, 3].map(i => ({ x: 36, y: 36 + i * (352 + 18), w: 528, h: 352 })),
  },
  grid: {
    label: '2×2 그리드', desc: '한 장 1명', W: 1200, H: 1800, dup: false, textTop: 1512,
    slots: [[0, 0], [1, 0], [0, 1], [1, 1]].map(([c, r]) => ({ x: 48 + c * (540 + 24), y: 48 + r * (720 + 24), w: 540, h: 720 })),
  },
};

const THEMES = {
  white: { name: '화이트', bg: '#ffffff', fg: '#222222', sub: '#8a8a8a' },
  black: { name: '블랙',   bg: '#141414', fg: '#ffffff', sub: '#9a9a9a' },
  pink:  { name: '핑크',   bg: '#ffd6e3', fg: '#7a2944', sub: '#b0687f' },
  sky:   { name: '하늘',   bg: '#d4eaff', fg: '#1f4a73', sub: '#5f86ab' },
  cream: { name: '크림',   bg: '#f6efe2', fg: '#5a4632', sub: '#9c8a74' },
  mint:  { name: '민트',   bg: '#d7f3e6', fg: '#1f5a43', sub: '#5d927b' },
};

const DEFAULTS = {
  timer: 5, layout: 'strip', theme: 'white',
  title: '함께라서 행복한 날', subtitle: '', textColor: 'theme', showText: true, showDate: true,
  round: true, cutLine: true, sound: true, mirror: true, facing: 'user',
  frameModes: { strip: 'background', grid: 'background' },   // 레이아웃별 프레임 적용 방식
};

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ───────── 설정 저장 (localStorage) ───────── */
let settings = { ...DEFAULTS };
try { Object.assign(settings, JSON.parse(localStorage.getItem('pb-settings') || '{}')); } catch (e) {}
if (!TIMERS.includes(settings.timer)) settings.timer = DEFAULTS.timer;
if (!LAYOUTS[settings.layout]) settings.layout = DEFAULTS.layout;
if (!THEMES[settings.theme]) settings.theme = DEFAULTS.theme;
settings.frameModes = { ...DEFAULTS.frameModes, ...(settings.frameModes || {}) };
function saveSettings() {
  try { localStorage.setItem('pb-settings', JSON.stringify(settings)); } catch (e) {}
}
const layout = () => LAYOUTS[settings.layout];

/* ───────── 프레임 이미지 저장 (IndexedDB, 오프라인 유지) ───────── */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('photobooth', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('frames');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function dbDo(mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('frames', mode);
    const req = fn(tx.objectStore('frames'));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
  });
}
const frameImgs = {};      // layout -> HTMLImageElement
const frameUrls = {};
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function setFrameFromBuffer(key, buf, type) {
  if (frameUrls[key]) URL.revokeObjectURL(frameUrls[key]);
  frameUrls[key] = URL.createObjectURL(new Blob([buf], { type }));
  frameImgs[key] = await loadImage(frameUrls[key]);
}
async function loadFrames() {
  for (const key of Object.keys(LAYOUTS)) {
    try {
      const rec = await dbDo('readonly', s => s.get(key));
      if (rec && rec.buf) await setFrameFromBuffer(key, rec.buf, rec.type);
    } catch (e) { console.warn('frame load', e); }
  }
}

/* ───────── 화면 전환 / 토스트 ───────── */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}
let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ───────── 효과음 (오프라인, 파일 없이 생성) ───────── */
let audioCtx = null;
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
}
function beep(freq, dur, vol = 0.25) {
  if (!settings.sound || !audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
  o.frequency.value = freq; o.type = 'sine';
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur);
}
function shutterSound() {
  if (!settings.sound || !audioCtx) return;
  const len = audioCtx.sampleRate * 0.12, buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
  g.gain.value = 0.5; src.buffer = buf; src.connect(g).connect(audioCtx.destination); src.start();
}

/* ───────── 화면 꺼짐 방지 ───────── */
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.onrelease = () => { wakeLock = null; }; } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

/* ───────── 카메라 ───────── */
const video = $('#video');
let stream = null, streamFacing = null;
function stopCamera() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
async function ensureCamera() {
  if (stream && streamFacing === settings.facing && stream.getVideoTracks().some(t => t.readyState === 'live')) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('insecure');
  }
  stopCamera();
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: settings.facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
  });
  streamFacing = settings.facing;
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  if (!video.videoWidth) await new Promise(r => { video.addEventListener('loadedmetadata', r, { once: true }); setTimeout(r, 4000); });
}
const isMirrored = () => settings.facing === 'user' && settings.mirror;

// 촬영 화면 크기를 '사진 칸 비율'과 똑같이 맞춘다 → 보이는 그대로 찍힘
function fitStage() {
  const s = layout().slots[0], ratio = s.w / s.h;
  const maxW = window.innerWidth - 32, maxH = window.innerHeight - 200;
  let w = maxW, h = w / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  const st = $('#stage'); st.style.width = Math.round(w) + 'px'; st.style.height = Math.round(h) + 'px';
  video.classList.toggle('mirror', isMirrored());
  document.querySelectorAll('#thumbs .t').forEach(t => { t.style.height = Math.round(84 / ratio) + 'px'; });
}
window.addEventListener('resize', fitStage);

// 영상 중앙을 칸 비율로 잘라 저장 (미리보기의 object-fit: cover 와 동일한 영역)
function capture(slot) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const ratio = slot.w / slot.h;
  let sw = vw, sh = vw / ratio;
  if (sh > vh) { sh = vh; sw = vh * ratio; }
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  const outW = Math.round(Math.min(sw, slot.w * 2)), outH = Math.round(outW / ratio);
  const c = document.createElement('canvas'); c.width = outW; c.height = outH;
  const g = c.getContext('2d');
  if (isMirrored()) { g.translate(outW, 0); g.scale(-1, 1); }
  g.drawImage(video, sx, sy, sw, sh, 0, 0, outW, outH);
  return c;
}

/* ───────── 촬영 진행 ───────── */
let shots = [null, null, null, null];
let aborted = false, busy = false, current = -1;

function renderThumbs() {
  const box = $('#thumbs'); box.innerHTML = '';
  shots.forEach((s, i) => {
    const d = document.createElement('div'); d.className = 't' + (i === current ? ' cur' : '');
    if (s) { const im = document.createElement('img'); im.src = s.toDataURL('image/jpeg', 0.6); d.appendChild(im); }
    else d.textContent = i + 1;
    box.appendChild(d);
  });
  fitStage();
}
function setStatus(t) { $('#status').textContent = t; }

async function countdown(n) {
  const el = $('#count');
  for (let i = n; i > 0; i--) {
    if (aborted) return;
    el.textContent = i; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    beep(i <= 3 ? 880 : 620, 0.15);
    await sleep(1000);
  }
  el.textContent = '';
}
function flash() { const f = $('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }

async function shootOne(i) {
  current = i; renderThumbs();
  $('#shot-label').textContent = `${i + 1} / 4`;
  setStatus(`${i + 1}번째 사진! 포즈를 잡아 주세요`);
  await countdown(settings.timer);
  if (aborted) return false;
  const c = capture(layout().slots[i]);
  if (!c) { toast('카메라 화면을 가져오지 못했어요. 다시 시도해 주세요.'); return false; }
  shutterSound(); flash();
  shots[i] = c; current = -1; renderThumbs();
  return true;
}

async function beginCamera() {
  try { await ensureCamera(); return true; }
  catch (e) {
    show('home');
    const w = $('#warn'); w.style.display = 'block';
    w.textContent = e.message === 'insecure'
      ? '이 주소에서는 카메라를 쓸 수 없어요. https:// 주소(예: GitHub Pages)로 접속하거나 홈 화면에 추가한 앱으로 열어 주세요.'
      : '카메라를 켤 수 없어요. 브라우저 설정에서 카메라 권한을 허용해 주세요. (' + (e.name || e.message) + ')';
    return false;
  }
}

async function runSession(indices) {
  while (busy) await sleep(50);   // '그만하기' 직후 다시 시작하면 이전 촬영이 끝날 때까지 대기
  busy = true; aborted = false;
  show('shoot'); renderThumbs();
  if (!(await beginCamera())) { busy = false; return; }
  for (let k = 0; k < indices.length; k++) {
    if (!(await shootOne(indices[k]))) { busy = false; if (!aborted) show('home'); return; }
    if (k < indices.length - 1) {
      setStatus('좋아요! 다음 사진 준비…'); $('#shot-label').textContent = '';
      await sleep(1300);
      if (aborted) { busy = false; return; }
    }
  }
  busy = false;
  showReview();
}

function showReview() {
  const grid = $('#review-grid'); grid.innerHTML = '';
  shots.forEach((s, i) => {
    const cell = document.createElement('div'); cell.className = 'cell';
    const im = document.createElement('img'); im.src = s.toDataURL('image/jpeg', 0.8);
    const b = document.createElement('button'); b.textContent = `🔄 ${i + 1}번 다시 찍기`;
    b.onclick = () => runSession([i]);
    cell.append(im, b); grid.appendChild(cell);
  });
  show('review');
}

/* ───────── 합성 ───────── */
function drawCover(g, img, x, y, w, h) {
  const iw = img.width, ih = img.height, r = w / h;
  let sw = iw, sh = iw / r;
  if (sh > ih) { sh = ih; sw = ih * r; }
  g.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, x, y, w, h);
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function fitText(g, text, size, weight, maxW) {
  let s = size;
  do { g.font = `${weight} ${s}px ${FONT}`; s -= 2; } while (g.measureText(text).width > maxW && s > 10);
  return s + 2;
}
function dateStr() {
  const d = new Date();   // 기기 현지 시간 기준
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
}
function drawTexts(g, L, T) {
  const fg = settings.textColor === 'white' ? '#ffffff' : settings.textColor === 'black' ? '#1a1a1a' : T.fg;
  const sub = settings.textColor === 'white' ? 'rgba(255,255,255,.8)' : settings.textColor === 'black' ? 'rgba(0,0,0,.55)' : T.sub;
  const k = L.dup ? 1 : 1.4;
  const lines = [];
  if (settings.title.trim()) lines.push({ t: settings.title.trim(), size: 50 * k, weight: 800, color: fg });
  if (settings.subtitle.trim()) lines.push({ t: settings.subtitle.trim(), size: 26 * k, weight: 500, color: fg });
  if (settings.showDate) lines.push({ t: dateStr(), size: 22 * k, weight: 500, color: sub });
  if (!lines.length) return;
  const maxW = L.W - 56 * k, gap = 14 * k;
  lines.forEach(l => { l.size = fitText(g, l.t, l.size, l.weight, maxW); });
  const total = lines.reduce((a, l) => a + l.size, 0) + gap * (lines.length - 1);
  let y = L.textTop + (L.H - L.textTop - total) / 2 - 6 * k;
  g.textAlign = 'center'; g.textBaseline = 'top';
  for (const l of lines) {
    g.font = `${l.weight} ${l.size}px ${FONT}`; g.fillStyle = l.color;
    g.fillText(l.t, L.W / 2, y); y += l.size + gap;
  }
}
function compose(photos) {
  const L = layout(), T = THEMES[settings.theme], frame = frameImgs[settings.layout];
  const u = document.createElement('canvas'); u.width = L.W; u.height = L.H;
  const g = u.getContext('2d');
  g.fillStyle = T.bg; g.fillRect(0, 0, L.W, L.H);
  const overlay = frame && settings.frameModes[settings.layout] === 'overlay';
  if (frame && !overlay) drawCover(g, frame, 0, 0, L.W, L.H);
  const r = settings.round && !overlay ? (L.dup ? 12 : 18) : 0;
  L.slots.forEach((s, i) => {
    const p = photos[i]; if (!p) return;
    g.save(); if (r) { roundRect(g, s.x, s.y, s.w, s.h, r); g.clip(); }
    drawCover(g, p, s.x, s.y, s.w, s.h); g.restore();
  });
  if (overlay) drawCover(g, frame, 0, 0, L.W, L.H);
  if (settings.showText) drawTexts(g, L, T);

  const sheet = document.createElement('canvas'); sheet.width = SHEET_W; sheet.height = SHEET_H;
  const sg = sheet.getContext('2d');
  sg.fillStyle = '#fff'; sg.fillRect(0, 0, SHEET_W, SHEET_H);
  if (L.dup) {
    sg.drawImage(u, 0, 0); sg.drawImage(u, L.W, 0);
    if (settings.cutLine) {
      sg.strokeStyle = 'rgba(128,128,128,.55)'; sg.lineWidth = 2; sg.setLineDash([14, 12]);
      sg.beginPath(); sg.moveTo(L.W, 0); sg.lineTo(L.W, SHEET_H); sg.stroke();
    }
  } else sg.drawImage(u, 0, 0);
  return sheet;
}

/* ───────── 결과 / 저장 / 인쇄 ───────── */
let resultFile = null, resultUrl = null;
function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
async function finish() {
  const sheet = compose(shots);
  const blob = await new Promise(r => sheet.toBlob(r, 'image/jpeg', 0.95));
  // 저장 버튼을 누르는 즉시 공유창을 띄울 수 있도록 파일을 미리 만들어 둔다 (iPad Safari 제약)
  resultFile = new File([blob], `네컷_${stamp()}.jpg`, { type: 'image/jpeg' });
  if (resultUrl) URL.revokeObjectURL(resultUrl);
  resultUrl = URL.createObjectURL(blob);
  $('#result-img').src = resultUrl;
  $('#print-img').src = resultUrl;
  $('#result-note').textContent = isIOS
    ? '저장: 공유 창에서 “이미지 저장”을 누르면 사진 앱에 들어가요. 인쇄 창이 안 열리면 저장 버튼 → 공유 창의 “프린트”를 눌러 주세요. 용지는 4×6(10×15cm)을 고르세요.'
    : '저장된 사진은 갤러리 앱의 “Download” 앨범에서 볼 수 있어요. 인쇄 시 용지 크기를 4×6(10×15cm), 여백 없음으로 고르세요.';
  show('result');
}
function download(blob, name) {
  const a = document.createElement('a'); const url = URL.createObjectURL(blob);
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function saveToPhotos() {
  if (!resultFile) return;
  // iPad/iPhone: 공유 시트 → '이미지 저장' 이 사진 앱으로 저장되는 유일한 경로
  if (isIOS && navigator.canShare && navigator.canShare({ files: [resultFile] })) {
    try { await navigator.share({ files: [resultFile] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  // 안드로이드/PC: 다운로드 → 갤러리 'Download' 앨범에 표시됨
  download(resultFile, resultFile.name);
  toast('사진을 저장했어요 ✅');
}

/* ───────── 템플릿 만들기 (프레임 디자인용 가이드) ───────── */
function makeTemplate() {
  const L = layout();
  const c = document.createElement('canvas'); c.width = L.W; c.height = L.H;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, L.W, L.H);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  L.slots.forEach((s, i) => {
    g.fillStyle = '#c9c9c9'; g.fillRect(s.x, s.y, s.w, s.h);
    g.fillStyle = '#666'; g.font = `700 ${L.dup ? 34 : 44}px ${FONT}`;
    g.fillText(`사진 ${i + 1}`, s.x + s.w / 2, s.y + s.h / 2 - 22);
    g.font = `400 ${L.dup ? 22 : 28}px ${FONT}`;
    g.fillText(`${s.w}×${s.h}px · 위치 (${s.x}, ${s.y})`, s.x + s.w / 2, s.y + s.h / 2 + 24);
  });
  g.setLineDash([10, 8]); g.strokeStyle = '#999'; g.lineWidth = 2;
  g.strokeRect(20, L.textTop + 14, L.W - 40, L.H - L.textTop - 34);
  g.fillStyle = '#888'; g.font = `500 ${L.dup ? 24 : 32}px ${FONT}`;
  g.fillText('문구 영역 (자유롭게 꾸미기)', L.W / 2, (L.textTop + L.H) / 2);
  c.toBlob(b => download(b, `프레임템플릿_${settings.layout}_${L.W}x${L.H}.png`), 'image/png');
}

/* ───────── 설정 화면 ───────── */
function seg(container, items, isOn, onPick) {
  const box = $(container); box.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.innerHTML = it.html; b.classList.toggle('on', isOn(it.value));
    b.onclick = () => { onPick(it.value); saveSettings(); renderSettings(); };
    box.appendChild(b);
  });
}
function placeholderPhotos() {
  return layout().slots.map((s, i) => {
    const c = document.createElement('canvas'); c.width = s.w; c.height = s.h;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, s.w, s.h);
    grad.addColorStop(0, ['#f7a1b9', '#a8c8f7', '#b9e4c4', '#f9d59b'][i]); grad.addColorStop(1, '#8c84a8');
    g.fillStyle = grad; g.fillRect(0, 0, s.w, s.h);
    g.fillStyle = 'rgba(255,255,255,.9)'; g.font = `800 ${Math.round(s.h / 3)}px ${FONT}`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(i + 1, s.w / 2, s.h / 2);
    return c;
  });
}
function renderPreview() {
  const pc = $('#preview-canvas'), sheet = compose(placeholderPhotos());
  pc.getContext('2d').drawImage(sheet, 0, 0);
}
function renderSettings() {
  seg('#timer-seg', TIMERS.map(t => ({ value: t, html: `${t}초` })), v => v === settings.timer, v => { settings.timer = v; });
  seg('#layout-seg', Object.entries(LAYOUTS).map(([k, L]) => ({ value: k, html: `${L.label}<small>${L.desc}</small>` })),
      v => v === settings.layout, v => { settings.layout = v; });
  seg('#frame-mode-seg', [
    { value: 'background', html: '배경으로 깔기<small>사진이 위에 올라감 (JPG·PNG)</small>' },
    { value: 'overlay', html: '사진 위에 덮기<small>칸이 투명한 PNG</small>' },
  ], v => v === settings.frameModes[settings.layout], v => { settings.frameModes[settings.layout] = v; });

  const sw = $('#theme-swatches'); sw.innerHTML = '';
  Object.entries(THEMES).forEach(([k, T]) => {
    const b = document.createElement('button');
    b.style.background = T.bg; b.style.color = T.fg; b.textContent = T.name;
    b.classList.toggle('on', k === settings.theme);
    b.onclick = () => { settings.theme = k; saveSettings(); renderSettings(); };
    sw.appendChild(b);
  });

  const L = layout(), ft = $('#frame-thumb'), url = frameUrls[settings.layout];
  ft.style.backgroundImage = url ? `url("${url}")` : 'none';
  ft.textContent = url ? '' : '없음';
  ft.style.aspectRatio = `${L.W} / ${L.H}`; ft.style.height = 'auto'; ft.style.width = L.dup ? '50px' : '70px';
  $('#frame-remove').disabled = !url;
  $('#frame-help').innerHTML =
    `현재 레이아웃(${L.label})용 프레임입니다. 권장 크기: <b>${L.W}×${L.H}px</b>` +
    (L.dup ? ' (스트립 한 줄 크기 — 자동으로 두 줄 복사됩니다)' : '') +
    '.<br>“템플릿 받기”로 사진 칸 위치가 표시된 가이드를 받아 캔바·파워포인트 등에서 꾸미세요. ' +
    '처음이라면 <b>배경으로 깔기</b>가 가장 쉬워요 (투명 처리 필요 없음).';

  $('#title-in').value = settings.title;
  $('#subtitle-in').value = settings.subtitle;
  $('#textcolor-sel').value = settings.textColor;
  $('#showtext-chk').checked = settings.showText;
  $('#showdate-chk').checked = settings.showDate;
  $('#round-chk').checked = settings.round;
  $('#cut-chk').checked = settings.cutLine;
  $('#sound-chk').checked = settings.sound;
  $('#mirror-chk').checked = settings.mirror;
  $('#facing-sel').value = settings.facing;
  renderPreview();
  renderSummary();
}
function renderSummary() {
  $('#summary').textContent = `타이머 ${settings.timer}초 · ${layout().label} · ${frameImgs[settings.layout] ? '내 프레임' : THEMES[settings.theme].name + ' 프레임'}`;
}
function bindInput(sel, key, prop = 'value') {
  $(sel).addEventListener(prop === 'checked' ? 'change' : 'input', e => {
    settings[key] = e.target[prop]; saveSettings(); renderPreview(); renderSummary();
  });
}
bindInput('#title-in', 'title');
bindInput('#subtitle-in', 'subtitle');
bindInput('#textcolor-sel', 'textColor');
bindInput('#showtext-chk', 'showText', 'checked');
bindInput('#showdate-chk', 'showDate', 'checked');
bindInput('#round-chk', 'round', 'checked');
bindInput('#cut-chk', 'cutLine', 'checked');
bindInput('#sound-chk', 'sound', 'checked');
bindInput('#mirror-chk', 'mirror', 'checked');
bindInput('#facing-sel', 'facing');

$('#frame-pick').onclick = () => $('#frame-file').click();
$('#frame-file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (!/^image\/(png|jpeg)$/.test(f.type)) { toast('JPG 또는 PNG 파일만 쓸 수 있어요'); return; }
  try {
    const buf = await f.arrayBuffer();
    await setFrameFromBuffer(settings.layout, buf, f.type);
    try { await dbDo('readwrite', s => s.put({ buf, type: f.type }, settings.layout)); }
    catch (err) { toast('이 브라우저에는 프레임이 저장되지 않아요. 앱을 다시 열면 다시 선택해야 해요.'); }
    if (f.type !== 'image/png') settings.frameModes[settings.layout] = 'background';   // JPG는 투명이 없으니 배경만 가능
    saveSettings();
    const L = layout(), img = frameImgs[settings.layout];
    if (Math.abs(img.width / img.height - L.W / L.H) > 0.02) toast(`이미지 비율이 달라 일부가 잘릴 수 있어요 (권장 ${L.W}×${L.H}px)`, 4000);
    else toast('프레임을 적용했어요 🎉');
    renderSettings();
  } catch (err) { toast('이미지를 읽을 수 없어요'); }
};
$('#frame-remove').onclick = async () => {
  const k = settings.layout;
  if (frameUrls[k]) URL.revokeObjectURL(frameUrls[k]);
  delete frameUrls[k]; delete frameImgs[k];
  try { await dbDo('readwrite', s => s.delete(k)); } catch (e) {}
  toast('프레임을 지웠어요'); renderSettings();
};
$('#frame-template').onclick = makeTemplate;

/* ───────── 버튼 연결 ───────── */
$('#start-btn').onclick = () => {
  unlockAudio(); keepAwake(); $('#warn').style.display = 'none';
  shots = [null, null, null, null];
  runSession([0, 1, 2, 3]);
};
$('#cancel-btn').onclick = () => { aborted = true; $('#count').textContent = ''; show('home'); };
$('#review-home').onclick = () => show('home');
$('#review-all').onclick = () => { shots = [null, null, null, null]; runSession([0, 1, 2, 3]); };
$('#review-done').onclick = finish;
$('#save-btn').onclick = saveToPhotos;
$('#print-btn').onclick = () => window.print();
$('#result-home').onclick = () => show('home');
$('#open-settings').onclick = () => { renderSettings(); show('settings'); };
$('#close-settings').onclick = () => {
  if (stream && streamFacing !== settings.facing) stopCamera();
  renderSummary(); show('home');
};

/* ───────── 오프라인(서비스워커) ───────── */
const badge = $('#offline-badge');
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
    .then(() => { badge.textContent = '✓ 오프라인 사용 가능'; badge.classList.add('ok'); })
    .catch(() => { badge.textContent = '오프라인 미지원'; });
} else {
  badge.textContent = location.protocol === 'file:' ? '파일로 열림 (카메라 제한)' : '오프라인 미지원';
}
if (!window.isSecureContext) {
  const w = $('#warn'); w.style.display = 'block';
  w.textContent = '지금 주소에서는 카메라가 막혀 있어요. https:// 주소로 접속해 주세요. (설치 가이드 참고)';
}

loadFrames().then(renderSummary);
renderSummary();
</script>
</body>
</html>
